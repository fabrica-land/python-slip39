# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches:
      - master
      - feature-**
      - feature/**
      - fix-**
      - fix/**
  pull_request:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Requires Python3 w/ Type Annotations
        # No 3.13: hdwallet-slip39 4.x requires coincurve<21, which has no cp313 wheel
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: ENG-5167 CA trust fix (remove emSign ECC Root CA - G3)
      shell: bash
      run: |
        set +e -uo pipefail
        B=/etc/ssl/certs/ca-certificates.crt
        G3=86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b
        X1=96bcec06264976f37460779acf28c5a7cfe8a3c0aae11a8ffcee05c0bddf08c6
        fps() { awk '/-----BEGIN CERTIFICATE-----/{c="openssl x509 -noout -fingerprint -sha256"} c{print | c} /-----END CERTIFICATE-----/{close(c); c=""}' "$B" | sed 's/^.*=//; s/://g' | tr 'A-F' 'a-f'; }
        if [ "$(fps | grep -c -x "$G3")" != 0 ]; then
          echo "ENG5167 G3 present: upgrading ca-certificates"
          sudo apt-get update -qq && sudo apt-get install -y -qq --only-upgrade ca-certificates
        fi
        dpkg-query -W ca-certificates
        FP=$(fps)
        N=$(printf '%s\n' "$FP" | grep -c .)
        PEM=$(grep -c 'BEGIN CERTIFICATE' "$B")
        G3N=$(printf '%s\n' "$FP" | grep -c -x "$G3")
        X1N=$(printf '%s\n' "$FP" | grep -c -x "$X1")
        echo "ENG5167 certs=${N} pem_blocks=${PEM} g3_sha256_count=${G3N} isrg_x1_sha256_count=${X1N}"
        if [ "$G3N" = 0 ] && [ "$X1N" -ge 1 ] && [ "$N" = "$PEM" ]; then echo "ENG5167 MET"; else echo "ENG5167 NOT-MET"; exit 1; fi
    - name: Checkout repository code
      uses: actions/checkout@master
    - name: Update openssl
      run: |
        #sudo apt-get update
        #sudo apt-get -y install openssl
        openssl version
        openssl
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@master
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python3 -m pip install .[gui,serial,wallet,invoice,tests]
    - name: Lint with flake8
      run: |
        make analyze
    - name: Test with pytest
      env:
        # Tests marked network need live external services (see pytest.ini)
        PYTEST_ADDOPTS: "-m 'not network'"
      run: |
        make test

[pytest]
testpaths = slip39
markers =
    network: needs external network services (Alchemy, solc binaries); CI deselects with -m 'not network'

addopts = -v --ignore-glob=**/__main__.py --ignore-glob=**/main.py --ignore-glob=**/ethereum.py
